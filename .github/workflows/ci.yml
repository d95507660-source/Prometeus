# CI для farm/: Python (ruff + mypy + pytest на 3.10) и JS (node --check + jest на Node 18).
# Без секретов и без сети к GCP/Anthropic/площадкам: всё внешнее в тестах подменено моками.
name: farm-ci

on:
  push:
    paths:
      - "farm/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "farm/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farm-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: farm

jobs:
  python:
    name: Python 3.10 — ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: farm/requirements-dev.txt

      # node нужен тесту test_pnl (рендер панели), ffmpeg — тесту ghost (иначе он пропускается)
      - uses: actions/setup-node@v5
        with:
          node-version: "18"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check --output-format=github .

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest -q -rs

  js:
    name: Node 18 — node --check, jest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: farm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run --silent check

      - name: Jest
        run: npx jest --ci
